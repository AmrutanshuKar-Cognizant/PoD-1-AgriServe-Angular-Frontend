<header *ngIf="isLoggedIn" class="h-20 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm z-10 shrink-0 w-full sticky top-0">
  
  <div class="flex-1 flex items-center gap-10">
    
    <ng-container *ngIf="isHomePage">
      <div class="flex items-center gap-2 cursor-pointer" routerLink="/">
        
        <div class="h-20 flex items-center px-6 relative z-10 border-b border-slate-800/50">
            <div class="flex items-center gap-3 cursor-pointer" routerLink="/">
                <img src="/assets/logo.png" alt="AgriServe Logo" class="h-20 w-auto drop-shadow-sm">
            </div>
        </div>    
      </div>

      <nav class="hidden md:flex items-center gap-6">
        <a *ngFor="let item of filteredHeaderMenu" 
           [routerLink]="item.route"
           routerLinkActive="text-green-600 font-bold border-b-2 border-green-600 pb-1"
           [routerLinkActiveOptions]="{exact: false}"
           class="text-sm font-medium text-gray-600 hover:text-green-600 transition-colors pt-1">
          {{ item.label }}
        </a>
      </nav>
    </ng-container>

    </div>

  <div class="flex items-center gap-6">
    
    
    <div class="relative group pb-2 pt-2">
      <div class="flex items-center gap-2 cursor-pointer p-1.5 rounded-lg transition-colors hover:bg-gray-50">
        <div class="w-9 h-9 rounded-full bg-blue-100 border border-blue-200 flex items-center justify-center text-blue-700 font-bold text-sm shadow-inner">
          {{ userInitials }}
        </div>
        <span class="text-sm font-medium text-gray-700 hidden sm:block">{{ userName }}</span>
      </div>

      <div class="absolute right-0 top-full mt-[-8px] w-48 bg-white rounded-xl shadow-lg border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform origin-top border-t-4 border-t-transparent z-50">
        <div class="py-2">
          <a routerLink="/profile" class="block px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 hover:text-blue-600 transition-colors">View Profile</a>
          <hr class="my-1 border-gray-100">
          <button (click)="logout()" class="w-full text-left px-4 py-2.5 text-sm font-medium text-red-600 hover:bg-red-50 transition-colors">Sign Out</button>
        </div>
      </div>
    </div>
  </div>
</header>

<header *ngIf="!isLoggedIn" class="bg-white/80 backdrop-blur-md border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 h-20 flex items-center justify-between">
    <div class="h-20 flex items-center px-6 relative z-10 border-b border-slate-800/50">
            <div class="flex items-center gap-3 cursor-pointer" routerLink="/">
                <img src="/assets/logo.png" alt="AgriServe Logo" class="h-20 w-auto drop-shadow-sm">
            </div>
        </div>    

    <div class="flex items-center gap-4">
      <a routerLink="/login" class="text-sm font-semibold text-gray-600 hover:text-green-600 transition-colors hidden sm:block">Sign In</a>
      <a routerLink="/register" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition-all shadow-sm hover:shadow active:scale-95">Get Started</a>
    </div>
  </div>
</header>
