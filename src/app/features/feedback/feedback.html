<div class="feedback-container">
  
  <div *ngIf="toastMessage" class="fixed top-6 right-6 z-[9999] transition-all duration-300">
    <div class="flex items-center gap-3 px-6 py-4 rounded-md shadow-2xl border-l-4 bg-white"
         [ngClass]="{
           'border-green-500': toastType === 'success',
           'border-red-500': toastType === 'error'
         }">
      
      <svg *ngIf="toastType === 'success'" class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      
      <svg *ngIf="toastType === 'error'" class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      
      <div>
        <h3 class="text-sm font-bold text-gray-900">
          {{ toastType === 'success' ? 'Success!' : 'Error' }}
        </h3>
        <p class="text-xs text-gray-500 mt-1">{{ toastMessage }}</p>
      </div>
    </div>
  </div>

  <div class="feedback-header">
    <h2>Feedback & Satisfaction</h2>
    <p>Share your feedback and help us improve our services.</p>
  </div>

  <div class="feedback-form-section">
    <div class="form-card">
      <h3>Submit Your Feedback</h3>

      <div class="type-selector">
        <label class="radio-label">
          <input type="radio" name="feedbackType" value="training" [(ngModel)]="feedbackType" (change)="onTypeChange('training')">
          <span class="radio-custom"></span>
          Training Program Feedback
        </label>
        <label class="radio-label">
          <input type="radio" name="feedbackType" value="advisory" [(ngModel)]="feedbackType" (change)="onTypeChange('advisory')">
          <span class="radio-custom"></span>
          Advisory Session Feedback
        </label>
      </div>

      <form class="feedback-form" (ngSubmit)="submitFeedback()">
        <div class="form-group" *ngIf="feedbackType === 'training'">
          <label for="programId">Program ID:</label>
          <input type="number" id="programId" [(ngModel)]="feedback.programId" name="programId" required>
        </div>

        <div class="form-group" *ngIf="feedbackType === 'advisory'">
          <label for="sessionId">Session ID:</label>
          <input type="number" id="sessionId" [(ngModel)]="feedback.sessionId" name="sessionId" required>
        </div>

        <div class="form-group">
          <label>Rating:</label>
          <div class="rating-stars">
            <span *ngFor="let star of [1,2,3,4,5]" 
                  class="star" 
                  [class.active]="star <= feedback.rating" 
                  (click)="feedback.rating = star"
                  style="cursor: pointer;">
              ★
            </span>
          </div>
          <span class="rating-text">{{ feedback.rating }}/5</span>
        </div>

        <div class="form-group">
          <label for="comment">Comment:</label>
          <textarea id="comment" [(ngModel)]="feedback.comment" name="comment" rows="4" placeholder="Share your thoughts..." required></textarea>
        </div>

        <div class="form-group">
          <label for="date">Date:</label>
          <input type="date" id="date" [(ngModel)]="feedback.date" name="date" required>
        </div>

        <button type="submit" class="btn-submit" [disabled]="isSubmitting">
          <span *ngIf="isSubmitting">Submitting...</span>
          <span *ngIf="!isSubmitting">Submit Feedback</span>
        </button>
      </form>
      
    </div>
  </div>
</div>
