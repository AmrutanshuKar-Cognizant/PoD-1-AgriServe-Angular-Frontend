<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-100">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Compliance ID</th>
          <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Type</th>
          <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Entity ID</th>
          <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Officer</th>
          <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Result</th>
          <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase">Date</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <tr *ngFor="let record of records" class="hover:bg-gray-50/50 transition-colors">
          <td class="px-6 py-4 text-sm font-bold text-gray-900">#CR-{{ record.complianceId }}</td>
          <td class="px-6 py-4 text-sm text-gray-700 font-medium">{{ formatType(record.type) }}</td>
          <td class="px-6 py-4 text-sm text-gray-500">ID: {{ record.entityId }}</td>
          <td class="px-6 py-4 text-sm text-gray-500">{{ record.officerName }}</td>
          <td class="px-6 py-4">
            <span class="px-2.5 py-1 text-xs font-semibold rounded-full border" [ngClass]="getResultBadgeClass(record.result)">
              {{ formatType(record.result) }}
            </span>
          </td>
          <td class="px-6 py-4 text-sm text-gray-500">{{ record.date | date:'mediumDate' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
