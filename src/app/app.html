<div class="app-shell">
 
  <aside class="sidebar">
 
    <div class="sidebar-brand">
      <div class="brand-icon">
        <i class="ti ti-plant" aria-hidden="true"></i>
      </div>
      <div class="brand-text">
        <span class="brand-name">AgriServe</span>
        <span class="brand-sub">Farmer Portal</span>
      </div>
    </div>
 
    <nav class="sidebar-nav" aria-label="Main navigation">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        class="nav-item"
        [attr.aria-label]="item.label"
      >
        <i class="ti {{ item.icon }}" aria-hidden="true"></i>
        <span>{{ item.label }}</span>
      </a>
    </nav>
 
    <div class="sidebar-footer">
      <div class="avatar-circle">RS</div>
      <div class="user-info">
        <span class="user-name">Ramesh Subramaniam</span>
        <span class="user-id">ID: FRM-2041</span>
      </div>
    </div>
 
  </aside>
 
  <div class="main-area">
 
    <!-- Topbar -->
    <header class="topbar">
      <span class="topbar-breadcrumb">
        <i class="ti ti-plant" style="color: var(--green); font-size:16px" aria-hidden="true"></i>
        AgriServe
      </span>
      <div class="topbar-actions">
        <span class="badge badge-green">
          <i class="ti ti-circle-check" aria-hidden="true"></i>
          Active Farmer
        </span>
      </div>
    </header>
 
    <!-- Routed page -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
 
  </div>
</div>
